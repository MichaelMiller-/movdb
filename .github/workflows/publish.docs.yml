name: publish.docs.yml
on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Setup caching
        uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache

      - name: Build
        run: pip install mkdocs-material

      - name: Deploy
        run: mkdocs gh-deploy --force