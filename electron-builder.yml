appId: sec21.movdb.app
productName: Movie Library

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

asarUnpack:
  - "node_modules/better-sqlite3/**"

linux:
  target:
    - AppImage
    - deb

  category: AudioVideo

  artifactName: "${productName}-${version}-${arch}.${ext}"